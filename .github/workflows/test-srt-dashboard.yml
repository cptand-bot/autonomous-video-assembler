name: Autonomous video pipeline

on:
  workflow_dispatch:
    inputs:
      srt_path:
        description: "Repository-relative SRT path"
        required: true
        default: "inputs/musk-starlink-5min.srt"
      georadar_key:
        description: "Optional GEO2 key, e.g. PROD_20261025_TOPIC_CHANNEL"
        required: false
        default: "PROD_20261025_MUSK_STARLINK_5MIN"
      audio_path:
        description: "Optional repository-relative MP3 path"
        required: false
        default: ""
      channel:
        description: "Channel"
        required: true
        default: "ПЛАНЕТА"
      topic:
        description: "Editorial topic anchors for search queries"
        required: false
        default: "Илон Маск Starlink Украина"
      changes_path:
        description: "Repository-relative review_changes.json saved from the dashboard"
        required: false
        default: ""
      approve:
        description: "Run final render after review"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  storyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m assembler.cli "${{ inputs.srt_path }}" --channel "${{ inputs.channel }}" --topic "${{ inputs.topic }}" --output build
      - name: Read Georadar context
        if: ${{ inputs.georadar_key != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            python -m assembler.georadar_job --root build --key "${{ inputs.georadar_key }}" --service-account-json "$GOOGLE_SERVICE_ACCOUNT_JSON"
          elif [ -f "inputs/georadar/${{ inputs.georadar_key }}.json" ]; then
            cp "inputs/georadar/${{ inputs.georadar_key }}.json" build/georadar.json
            echo "Using read-only Georadar context exported for this job"
          else
            echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON and no exported Georadar context"
            exit 1
          fi
      - name: Audit storyboard before fetch
        run: python -m assembler.audit --root build
      - uses: actions/upload-artifact@v4
        with:
          name: storyboard
          retention-days: 1
          path: build/

  fetch-review:
    needs: storyboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: storyboard, path: build}
      - name: Install FFmpeg for media validation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch media candidates
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -m assembler.fetch_job --root build --limit 8 --download
      - name: Upload fetch diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fetch-diagnostics
          retention-days: 1
          if-no-files-found: warn
          path: |
            build/fetch_report.json
            build/search_options.json
            build/images/manifest.json
      - name: Audit downloaded media
        if: ${{ always() }}
        run: python -m assembler.selfcheck --root build
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: review
          retention-days: 1
          path: build/
      - name: Publish review-ready status
        run: |
          {
            echo "## REVIEW READY"
            echo ""
            echo "Дашборд готов к утверждению. Скачайте artifact **review** и откройте review.html."
            echo ""
            echo "Финальный рендер не запускался: approve=false."
          } >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: fetch-review
    if: ${{ inputs.approve == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: review, path: build}
      # Решения человека входят в сборку здесь. Без этого шага рендер шёл по
      # артефакту, который человек ещё не видел, а кнопка «Утвердить ролик»
      # была украшением: approval.json не читал никто.
      - name: Apply human review decisions
        run: |
          if [ -n "${{ inputs.changes_path }}" ] && [ -f "${{ inputs.changes_path }}" ]; then
            python -m assembler.apply_changes --root build --changes "${{ inputs.changes_path }}"
          else
            echo "Файл правок не передан: рендер пойдёт только если approval.json уже утверждён"
          fi
      - name: Self-check approved job
        run: python -m assembler.selfcheck --root build
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render approved silent video
        run: |
          if [ -n "${{ inputs.audio_path }}" ]; then
            python -m assembler.render --root build --output build/output.mp4 --audio "${{ inputs.audio_path }}"
          else
            python -m assembler.render --root build --output build/output.mp4
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          retention-days: 1
          path: |
            build/output.mp4
            build/render_manifest.json
